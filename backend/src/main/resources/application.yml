spring:
  application:
    name: biblioteca-itsp

  datasource:
    url: jdbc:postgresql://localhost:5432/biblioteca_itsp
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info